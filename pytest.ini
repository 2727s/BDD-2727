[pytest]
# Default names, tdd.py for the discount test, and Bdd.py for the page checks.
python_files = test_*.py *_test.py tdd.py Bdd.py
# Feature files live here. test_login.py and Bdd.py load them.
bdd_features_base_dir = features
# Each run writes raw Allure results here. allure generate turns them into HTML.
addopts = --alluredir=allure-results --clean-alluredir
